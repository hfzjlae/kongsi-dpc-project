# ==================================================================
#  Nginx reverse proxy for the Kongsi API
#  Installed to /etc/nginx/conf.d/kongsi.conf by ec2-setup.sh
#
#  Nginx listens on port 80 (open to the internet) and forwards
#  /api/... requests to the Node.js API on port 3000 (NOT open to the
#  internet). Everything else is refused: this server is the
#  application tier only; the website itself is hosted on S3.
# ==================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Allow photo uploads up to 10 MB (the API itself limits to MAX_UPLOAD_MB)
    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Only used if STORAGE_MODE=local (not recommended on AWS)
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        return 404;
    }
}
