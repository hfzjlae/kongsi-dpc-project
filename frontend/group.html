<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kongsi — Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="groups.html">Kongsi</a>
    <span class="crumb">/ <b id="groupName">…</b></span>
    <span class="grow"></span>
    <button class="pill" id="invitePill" title="Copy invite code" hidden></button>
    <button class="btn" id="uploadBtn">+ Upload</button>
    <span class="avatar" id="meAvatar">?</span>
  </nav>

  <main class="page">
    <form class="filterbar" id="filterbar">
      <label class="search">
        🔍
        <input id="q" type="search" placeholder="Search captions, tags or comments…" aria-label="Search">
      </label>
      <select id="uploader" aria-label="Filter by uploader"><option value="">Uploader: All</option></select>
      <select id="tag" aria-label="Filter by tag"><option value="">Tag: All</option></select>
      <input id="from" type="date" aria-label="From date">
      <input id="to" type="date" aria-label="To date">
    </form>

    <div class="feed-head"><span class="livedot"></span> <span id="feedStatus">Loading…</span></div>

    <div class="masonry" id="feed"></div>
    <div class="empty" id="feedEmpty" hidden></div>

    <span class="served" id="served" hidden></span>
  </main>

  <div id="modalHost"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/group.js"></script>
</body>
</html>
