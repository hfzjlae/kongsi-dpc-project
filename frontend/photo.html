<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kongsi — Photo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="groups.html">Kongsi</a>
    <span class="crumb">/ <a href="#" id="backToGroup" style="text-decoration:none;color:inherit">Album</a> / <b>Photo</b></span>
    <span class="grow"></span>
    <button class="btn danger" id="deletePhoto" hidden>Delete photo</button>
    <span class="avatar" id="meAvatar">?</span>
  </nav>

  <main class="page" style="padding-top:22px">
    <div class="photo-grid">
      <div class="photo-left">
        <img class="hero" id="hero" alt="">
        <div class="photo-caption" id="caption"></div>
      </div>
      <div class="photo-right">
        <div class="cmt-head"><span class="livedot"></span> <span id="cmtStatus">Loading comments…</span></div>
        <div class="cmt-list" id="cmtList"></div>
        <div id="conflictHost"></div>
        <form class="cmt-box" id="cmtForm">
          <input id="cmtInput" placeholder="Add a comment…" autocomplete="off" maxlength="500">
          <button type="submit" aria-label="Send">↑</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/photo.js"></script>
</body>
</html>
