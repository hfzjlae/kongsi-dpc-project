<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kongsi — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-wrap">
    <main class="login">
      <div class="mark">K</div>
      <h1 id="title">Welcome to Kongsi</h1>
      <p class="say" id="say">Share the album with your crew.</p>

      <div class="seg" role="tablist" aria-label="Sign in or register">
        <button id="tabSignin" class="on" role="tab" aria-selected="true">Sign in</button>
        <button id="tabRegister" role="tab" aria-selected="false">Register</button>
      </div>

      <form id="authForm" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" placeholder="Your name">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <p class="form-msg" id="msg" role="status" aria-live="polite"></p>
        <button class="btn block" id="submitBtn" type="submit">Sign in</button>
      </form>

      <button class="muted-link" id="switchLink">New here? <b>Create an account</b></button>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
