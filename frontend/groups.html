<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kongsi — Your groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="nav">
    <a class="logo" href="groups.html">Kongsi</a>
    <span class="grow"></span>
    <button class="pill" id="signOut" title="Sign out">Sign out</button>
    <span class="avatar" id="meAvatar">?</span>
  </nav>

  <main class="page">
    <div class="page-h">
      <h2>Your groups</h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap">
        <form class="join-row" id="joinForm">
          <input id="joinCode" placeholder="Invite code" aria-label="Invite code" maxlength="16">
          <button class="btn ghost" type="submit">Join</button>
        </form>
        <button class="btn" id="createBtn">+ Create group</button>
      </div>
    </div>

    <div id="codeReveal"></div>
    <div class="grid" id="grid">
      <div class="empty" id="loading">Loading your groups…</div>
    </div>
  </main>

  <!-- create-group modal -->
  <div id="modalHost"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/groups.js"></script>
</body>
</html>
