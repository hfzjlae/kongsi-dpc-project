<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kongsi — shared photo albums for friends</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%223%22 width=%2224%22 height=%2226%22 rx=%222%22 fill=%22%23fff%22 stroke=%22%2317212b%22 stroke-width=%222%22/%3E%3Crect x=%227%22 y=%226%22 width=%2218%22 height=%2215%22 fill=%22%231f6f54%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <section class="auth-art">
      <span class="wordmark">kongsi</span>
      <div>
        <div class="print-stack" aria-hidden="true"><span></span><span></span><span></span></div>
        <h1>Your group's photos, in one shared album.</h1>
        <p>Make a group, invite your friends with a code, and everyone can add photos and talk about them.</p>
      </div>
      <p class="small">TEB3033 Distributed and Parallel Computing</p>
    </section>

    <section class="auth-form">
      <div class="panel">
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" id="tabSignIn" aria-selected="true">Sign in</button>
          <button class="tab" role="tab" id="tabRegister" aria-selected="false">Create account</button>
        </div>

        <p id="message" class="message" hidden></p>

        <!-- Sign in form -->
        <form id="signInForm">
          <div class="field">
            <label for="login">Username or email</label>
            <input type="text" id="login" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required />
          </div>
          <button class="button button-block" type="submit">Sign in</button>
        </form>

        <!-- Create account form -->
        <form id="registerForm" hidden>
          <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" />
            <p class="hint">Letters, numbers and underscores. Friends will see this name.</p>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="new-password" required minlength="8" />
            <p class="hint">At least 8 characters.</p>
          </div>
          <button class="button button-block" type="submit">Create account</button>
        </form>
      </div>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
